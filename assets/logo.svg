<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <!-- Fundo degradado -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DD9DD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B7FB5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circulo externo -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Círculo interno -->
  <circle cx="100" cy="100" r="85" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Lua -->
  <path d="M 70 60 Q 80 50 90 55 Q 100 60 95 75 Q 85 85 70 80 Q 65 75 70 60" fill="#5DD9DD" opacity="0.8"/>
  
  <!-- Estrela -->
  <polygon points="120,70 125,80 135,80 128,85 132,95 120,90 108,95 112,85 105,80 115,80" fill="#6B7FB5"/>
  
  <!-- Texto -->
  <text x="100" y="130" font-family="Space Grotesk, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#5DD9DD">LUAR</text>
</svg>
